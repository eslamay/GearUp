<div class="container py-10 max-w-2xl">

  <h1 class="font-display font-bold text-3xl text-ink mb-6 tracking-wide">
    {{ isEditMode ? 'EDIT PRODUCT' : 'ADD NEW PRODUCT' }}
  </h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5 bg-white p-8 rounded-lg shadow-sm">

    <div>
      <label class="block text-sm text-steel mb-1">Product Name</label>
      <input formControlName="name"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
    </div>

    <div>
      <label class="block text-sm text-steel mb-1">Description</label>
      <textarea formControlName="description" rows="4"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-steel mb-1">Price</label>
        <input type="number" step="0.01" formControlName="price"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>
      <div>
        <label class="block text-sm text-steel mb-1">Quantity in Stock</label>
        <input type="number" formControlName="quantityInStock"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-steel mb-1">Brand</label>
        <input formControlName="brand"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>
      <div>
        <label class="block text-sm text-steel mb-1">Type</label>
        <input formControlName="type"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>
    </div>

    <!-- product image -->
    <div>
      <label class="block text-sm text-steel mb-1">Product Image</label>

      @if (previewUrl) {
        <img [src]="previewUrl" class="w-32 h-32 object-cover rounded mb-2" />
      } @else if (existingPictureUrl) {
        <img [src]="existingPictureUrl | imageUrl" class="w-32 h-32 object-cover rounded mb-2" />
      }

      <input type="file" accept="image/*" (change)="onFileSelected($event)"
        class="block w-full text-sm text-steel" />
    </div>

    @if (errorMessages.length) {
      <ul class="text-danger text-sm space-y-1">
        @for (msg of errorMessages; track msg) {
          <li>{{ msg }}</li>
        }
      </ul>
    }

    <div class="flex gap-3">
      <button type="submit" [disabled]="form.invalid || loading"
        class="bg-accent text-white font-semibold px-6 py-2 rounded hover:opacity-90 transition disabled:opacity-50">
        {{ loading ? 'Saving...' : (isEditMode ? 'Save Changes' : 'Add Product') }}
      </button>
      <a routerLink="/shop"
        class="border border-gray-300 px-6 py-2 rounded hover:bg-gray-100 transition">
        Cancel
      </a>
    </div>

  </form>

</div>
