<div class="min-h-[80vh] flex items-center justify-center bg-paper px-4 py-10">
  <div class="bg-white shadow-md rounded-lg w-full max-w-md p-8">

    <div class="flex justify-center mb-6">
      <img src="/logo.png" alt="GearUp" class="h-8" />
    </div>

    <h1 class="font-display font-bold text-2xl text-ink text-center mb-6 tracking-wide">
      CREATE ACCOUNT
    </h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-steel mb-1">First name</label>
          <input formControlName="firstName"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div>
          <label class="block text-sm text-steel mb-1">Last name</label>
          <input formControlName="lastName"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
      </div>

      <div>
        <label class="block text-sm text-steel mb-1">Username</label>
        <input formControlName="username"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>

      <div>
        <label class="block text-sm text-steel mb-1">Email</label>
        <input type="email" formControlName="email"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>

      <div>
        <label class="block text-sm text-steel mb-1">Password</label>
        <input type="password" formControlName="password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent" />
      </div>

      <div>
        <label class="block text-sm text-steel mb-1">I want to</label>
        <select formControlName="role"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent">
          <option value="Customer">Shop for gear</option>
          <option value="Vendor">Sell as a vendor</option>
        </select>
      </div>

      @if (errorMessages.length) {
        <ul class="text-danger text-sm space-y-1">
          @for (msg of errorMessages; track msg) {
            <li>{{ msg }}</li>
          }
        </ul>
      }

      <button
        type="submit"
        [disabled]="form.invalid || loading"
        class="w-full bg-accent text-white font-semibold py-2 rounded hover:opacity-90 transition disabled:opacity-50"
      >
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>

    </form>

    <p class="text-center text-sm text-steel mt-6">
      Already have an account?
      <a routerLink="/account/login" class="text-accent font-medium hover:underline">Log in</a>
    </p>

  </div>
</div>
