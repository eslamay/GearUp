<div class="fixed top-20 right-4 z-60 space-y-3 w-80">
  @for (notification of signalRService.notifications(); track notification.id) {
    <div class="bg-white border-l-4 border-accent shadow-lg rounded-lg p-4 flex items-start justify-between gap-3 animate-slide-in">

      <div>
        <p class="text-sm font-medium text-ink">{{ notification.message }}</p>
        @if (notification.orderId) {
          <a [routerLink]="['/orders', notification.orderId]"
             class="text-xs text-accent hover:underline mt-1 inline-block">
            View Order →
          </a>
        }
      </div>

      <button (click)="dismiss(notification.id)" class="text-steel hover:text-ink transition text-lg leading-none">
        ×
      </button>

    </div>
  }
</div>
