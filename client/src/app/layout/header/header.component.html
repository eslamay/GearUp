<header class="bg-ink text-white sticky top-0 z-50">
  <div class="container flex items-center justify-between py-4">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center">
      <img src="/gearup_logo.png" alt="GearUp" class="h-9" />
    </a>

    <!-- Navigation Links -->
    <nav
      class="hidden md:flex items-center gap-8 font-display font-bold text-lg tracking-wide"
    >
      <a
        routerLink="/shop"
        routerLinkActive="text-accent"
        class="hover:text-accent transition"
      >
        SHOP
      </a>

      @if (accountService.currentUser(); as user) {
        @if (user.roles === "Vendor") {
          <a
            routerLink="/vendor/dashboard"
            routerLinkActive="text-accent"
            class="hover:text-accent transition"
          >
            VENDOR DASHBOARD
          </a>
        }

        @if (user.roles === "Admin") {
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="text-accent"
            class="hover:text-accent transition"
          >
            ADMIN DASHBOARD
          </a>
        }

        <a
          routerLink="/orders"
          routerLinkActive="text-accent"
          class="hover:text-accent transition"
        >
          MY ORDERS
        </a>

        <div class="flex items-center gap-4">
          <span class="text-sm font-body font-normal text-gray-300">
            Hi, {{ user.firstName ?? user.userName }}
          </span>
          <button (click)="logout()" class="hover:text-accent transition">
            LOGOUT
          </button>
        </div>
      } @else {
        <a
          routerLink="/account/login"
          routerLinkActive="text-accent"
          class="hover:text-accent transition"
        >
          LOGIN
        </a>
      }
    </nav>

    <!-- Cart Icon -->
    <a routerLink="/cart" class="relative">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
        />
      </svg>
      @if (cartService.itemCount() > 0) {
        <span
          class="absolute -top-2 -right-2 bg-accent text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center"
        >
          {{ cartService.itemCount() }}
        </span>
      }
    </a>
  </div>
</header>
